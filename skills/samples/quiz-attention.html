<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attention Is All You Need 이해도 퀴즈</title>
<style>
:root {
  --bg: #fbfaf7; --surface: #ffffff; --ink: #1d232b; --muted: #5d6673; --line: #e3e0d8;
  --accent: #1f6f78; --accent-soft: #e4f1f1; --evidence: #f6f1e4; --evidence-line: #c9a64a;
  --good: #2f7d4f; --good-soft: #e5f3ea; --bad: #b4443b; --bad-soft: #f8e7e5; --part: #a26b12; --part-soft: #f8efdc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181c; --surface: #1c2026; --ink: #e8e6e1; --muted: #a2a9b3; --line: #2e343c;
    --accent: #6cc3cb; --accent-soft: #1e3335; --evidence: #2a2619; --evidence-line: #b8963e;
    --good: #6fc18f; --good-soft: #1b2e23; --bad: #e0857c; --bad-soft: #351f1d; --part: #e0b25c; --part-soft: #33291a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.7 "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
}
main { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
.eyebrow { color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .06em; }
h1 { font-size: 28px; line-height: 1.35; margin: 6px 0 10px; }
.paper, .note { color: var(--muted); margin: 0 0 6px; font-size: 15px; }
.progress { display: flex; align-items: center; gap: 12px; margin: 24px 0 18px; font-size: 14px; color: var(--muted); }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px; }
.tags { display: flex; gap: 6px; margin-bottom: 10px; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.prompt { font-size: 18px; font-weight: 600; margin: 0 0 18px; }
.choices { display: grid; gap: 10px; }
.choice {
  display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%;
  padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: transparent;
  color: inherit; font: inherit; cursor: pointer;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice:disabled { cursor: default; }
.mark { font-weight: 700; color: var(--accent); }
textarea {
  width: 100%; min-height: 96px; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px;
  background: transparent; color: inherit; font: inherit; resize: vertical;
}
textarea:focus, .choice:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
button.btn {
  padding: 10px 18px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--accent);
  color: var(--surface); font: inherit; font-weight: 600; cursor: pointer;
}
button.btn.ghost { background: transparent; color: var(--accent); }
button.btn:disabled { opacity: .45; cursor: default; }
.feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; }
.feedback.right { background: var(--good-soft); }
.feedback.wrong { background: var(--bad-soft); }
.feedback.part, .feedback.self { background: var(--part-soft); }
.verdict { font-weight: 700; margin: 0 0 6px; }
.feedback.right .verdict { color: var(--good); }
.feedback.wrong .verdict { color: var(--bad); }
.feedback.part .verdict, .feedback.self .verdict { color: var(--part); }
.feedback p { margin: 6px 0; }
.label { font-size: 13px; color: var(--muted); font-weight: 600; }
blockquote.evidence {
  margin: 8px 0 0; padding: 8px 12px; background: var(--evidence); border-left: 3px solid var(--evidence-line);
  border-radius: 0 8px 8px 0; font-size: 14px;
}
blockquote.evidence b { color: var(--muted); font-weight: 600; margin-right: 6px; }
.score { font-size: 42px; font-weight: 700; color: var(--accent); margin: 4px 0; }
table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 15px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 13px; }
ul.review { padding-left: 18px; }
ul.review li { margin-bottom: 10px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
noscript { display: block; padding: 16px; border: 1px solid var(--line); border-radius: 10px; }
@media print { .actions, .progress { display: none; } }
</style>
</head>
<body>
<main>
  <div class="eyebrow">SOLO LEVELING PAPER · 이해도 퀴즈</div>
  <h1 id="title"></h1>
  <p class="paper" id="paper"></p>
  <p class="note" id="note" hidden></p>
  <div class="progress" id="progress"><span id="count"></span><div class="bar"><i id="fill"></i></div></div>
  <section class="card" id="stage" aria-live="polite"></section>
  <noscript>이 퀴즈는 브라우저에서 자바스크립트가 켜져 있어야 풀 수 있습니다.</noscript>
</main>
<script type="application/json" id="quiz-data">{"title": "Attention Is All You Need 이해도 퀴즈", "paper": "Vaswani et al., Attention Is All You Need (arXiv 1706.03762v7)", "goal": "이해", "note": "샘플: solo-leveling-quiz 기본값(10문항, 정의 4 · 관계 3 · 적용 3)으로 만든 예시입니다. 자료 없이 10분 안에 풀어 보세요.", "questions": [{"level": "정의", "type": "multiple_choice", "prompt": "이 논문이 제안한 트랜스포머(Transformer)의 구조를 가장 잘 설명한 것은?", "choices": ["순환과 합성곱 없이 어텐션만으로 입력과 출력의 관계를 잡는 구조", "RNN에 어텐션을 더해 성능을 높인 구조", "합성곱 층을 깊게 쌓아 병렬 처리를 늘린 구조", "인코더 없이 디코더만으로 번역하는 구조"], "correct_index": 0, "explanation": "논문은 순환과 합성곱을 완전히 빼고 어텐션 메커니즘에만 기대는 구조로 트랜스포머를 소개한다.", "evidence": [{"page": 1, "quote": "based solely on attention mechanisms, dispensing with recurrence and convolutions entirely"}]}, {"level": "정의", "type": "short_answer", "prompt": "셀프 어텐션(self-attention)은 무엇과 무엇의 관계를 계산하는 어텐션인가요?", "answer": "한 시퀀스 안의 서로 다른 위치들 사이의 관계", "grading_criteria": "'같은 시퀀스(문장) 안의 위치끼리'라는 뜻이 있으면 정답. '입력과 출력 사이'만 쓰면 오답.", "explanation": "셀프 어텐션은 하나의 시퀀스 안에서 서로 다른 위치를 연결해 그 시퀀스의 표현을 계산한다.", "evidence": [{"page": 2, "quote": "an attention mechanism relating different positions of a single sequence in order to compute a representation of the sequence"}]}, {"level": "정의", "type": "multiple_choice", "prompt": "기본 트랜스포머의 인코더는 같은 층을 몇 개 쌓았나요?", "choices": ["2개", "4개", "6개", "8개"], "correct_index": 2, "explanation": "인코더와 디코더 모두 같은 층 N = 6개를 쌓는다. 8은 멀티헤드 어텐션의 헤드 수다.", "evidence": [{"page": 3, "quote": "The encoder is composed of a stack of N = 6 identical layers."}]}, {"level": "정의", "type": "multiple_choice", "prompt": "위치별 피드포워드 네트워크(position-wise feed-forward network)의 구성으로 옳은 것은?", "choices": ["선형 변환 두 개 사이에 ReLU 활성화", "합성곱 층 세 개와 풀링", "어텐션 층 두 개와 소프트맥스", "선형 변환 하나와 시그모이드"], "correct_index": 0, "explanation": "각 위치에 따로, 똑같이 적용되는 두 개의 선형 변환이며 그 사이에 ReLU가 있다.", "evidence": [{"page": 5, "quote": "This consists of two linear transformations with a ReLU activation in between."}]}, {"level": "관계", "type": "multiple_choice", "prompt": "스케일드 닷-프로덕트 어텐션에서 내적을 sqrt(d_k)로 나누는 이유로 논문이 제시한 것은?", "choices": ["계산량을 줄이기 위해", "출력 차원을 d_v에 맞추기 위해", "학습률 조정을 대신하기 위해", "d_k가 크면 내적 값이 커져 소프트맥스 기울기가 매우 작아지는 것을 막기 위해"], "correct_index": 3, "explanation": "d_k가 크면 내적의 크기가 커져 소프트맥스가 기울기가 극히 작은 영역으로 밀린다고 추정하고, 이를 상쇄하려고 나눈다.", "evidence": [{"page": 4, "quote": "the dot products grow large in magnitude, pushing the softmax function into regions where it has extremely small gradients"}]}, {"level": "관계", "type": "short_answer", "prompt": "RNN 대신 어텐션만 쓰면 학습 속도 면에서 어떤 이점이 있다고 논문은 설명하나요? RNN의 어떤 성질과 관련 있는지 함께 쓰세요.", "answer": "RNN은 위치를 순서대로 계산해 한 예제 안에서 병렬 처리가 안 되지만, 트랜스포머는 이 순차 계산이 없어 훨씬 많이 병렬화할 수 있다.", "grading_criteria": "'RNN의 순차 계산(순서대로 계산)'과 '병렬화가 가능해짐' 두 요소가 모두 있으면 정답, 하나만 있으면 부분 점수.", "explanation": "RNN은 이전 은닉 상태에 의존해 순서대로 계산하므로 병렬화가 막히고, 트랜스포머는 이를 없애 병렬화를 크게 늘린다.", "evidence": [{"page": 2, "quote": "This inherently sequential nature precludes parallelization within training examples"}, {"page": 2, "quote": "The Transformer allows for significantly more parallelization"}]}, {"level": "관계", "type": "multiple_choice", "prompt": "멀티헤드 어텐션을 쓰는 이유로 논문이 든 것은?", "choices": ["헤드 하나보다 전체 계산 비용을 크게 줄일 수 있어서", "위치 인코딩 없이도 순서를 알 수 있어서", "서로 다른 표현 부분 공간의 정보를 서로 다른 위치에서 동시에 참고할 수 있어서", "디코더에서 미래 단어를 가릴 수 있어서"], "correct_index": 2, "explanation": "멀티헤드는 여러 표현 부분 공간을 동시에 보게 해 준다. 헤드 하나면 평균을 내는 과정에서 이것이 막힌다. 계산 비용은 헤드 하나와 비슷하다고 한다.", "evidence": [{"page": 5, "quote": "Multi-head attention allows the model to jointly attend to information from different representation subspaces at different positions."}]}, {"level": "적용", "type": "short_answer", "prompt": "순환도 합성곱도 없는 트랜스포머에 단어의 순서 정보를 알려 주려면 입력에 무엇을 더하나요? 논문이 고른 방식도 함께 쓰세요.", "answer": "위치 인코딩(positional encoding). 서로 다른 주파수의 사인·코사인 함수를 쓴다.", "grading_criteria": "'위치 인코딩(위치 임베딩)'이면 정답. 사인·코사인(sinusoid)까지 쓰면 만점, 위치 인코딩만 쓰면 부분 점수.", "explanation": "순서 정보를 주려고 인코더·디코더 입력 임베딩에 위치 인코딩을 더하고, 서로 다른 주파수의 사인·코사인 함수를 쓴다.", "evidence": [{"page": 6, "quote": "we add \"positional encodings\" to the input embeddings at the bottoms of the encoder and decoder stacks"}, {"page": 6, "quote": "we use sine and cosine functions of different frequencies"}]}, {"level": "적용", "type": "multiple_choice", "prompt": "번역 모델의 디코더가 i번째 단어를 예측할 때 i번째 이후 단어를 보지 못하게 하려면, 논문의 방식대로 어디에 무엇을 해야 하나요?", "choices": ["인코더 출력에 드롭아웃을 더 세게 건다", "위치 인코딩을 디코더에서만 뺀다", "헤드 수를 1개로 줄인다", "소프트맥스 입력에서 허용되지 않는 연결의 값을 -∞로 가린다(마스킹)"], "correct_index": 3, "explanation": "자기회귀 성질을 지키려고 스케일드 닷-프로덕트 어텐션 안에서, 소프트맥스 입력 중 허용되지 않는 연결을 -∞로 마스킹한다.", "evidence": [{"page": 5, "quote": "We implement this inside of scaled dot-product attention by masking out (setting to −∞) all values in the input of the softmax which correspond to illegal connections."}]}, {"level": "적용", "type": "multiple_choice", "prompt": "다른 사람이 '트랜스포머는 영어→독일어 번역에서 기존 최고 결과를 앙상블까지 포함해 앞섰다'고 발표했습니다. 이 주장을 확인하려면 논문의 어느 결과를 보면 되나요?", "choices": ["6.3절 영어 구문 분석 표 4", "6.1절 기계 번역 결과와 표 2 (Transformer (big) 28.4 BLEU)", "4절 표 1의 층별 계산 복잡도", "5.3절 옵티마이저 학습률 식"], "correct_index": 1, "explanation": "6.1절은 big 모델이 영어→독일어에서 앙상블을 포함한 기존 최고 모델보다 2.0 BLEU 이상 높은 28.4 BLEU를 냈다고 쓰고, 표 2에 비교가 정리되어 있다.", "evidence": [{"page": 8, "quote": "outperforms the best previously reported models (including ensembles) by more than 2.0 BLEU, establishing a new state-of-the-art BLEU score of 28.4"}]}]}</script>
<script>
(function () {
  'use strict';
  var quiz = JSON.parse(document.getElementById('quiz-data').textContent);
  var MARKS = ['①', '②', '③', '④', '⑤'];
  var LEVELS = ['정의', '관계', '적용'];
  var stage = document.getElementById('stage');
  var all = quiz.questions.map(function (q, i) { return i; });
  var order = all.slice();
  var pos = 0;
  var results = {};  // 문항 번호 → 1(맞음) / 0.5(부분) / 0(틀림)

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  document.title = quiz.title;
  document.getElementById('title').textContent = quiz.title;
  document.getElementById('paper').textContent = '논문: ' + quiz.paper + (quiz.goal ? ' · 학습 목적: ' + quiz.goal : '');
  if (quiz.note) {
    var note = document.getElementById('note');
    note.textContent = quiz.note;
    note.hidden = false;
  }

  function updateProgress() {
    var done = Math.min(pos, order.length);
    document.getElementById('count').textContent = done + ' / ' + order.length;
    document.getElementById('fill').style.width = (order.length ? done / order.length * 100 : 0) + '%';
  }

  function evidenceBlock(q) {
    var wrap = el('div');
    wrap.appendChild(el('div', 'label', '논문 근거'));
    q.evidence.forEach(function (e) {
      var quote = el('blockquote', 'evidence');
      quote.appendChild(el('b', '', 'p.' + e.page));
      quote.appendChild(document.createTextNode('"' + e.quote + '"'));
      wrap.appendChild(quote);
    });
    return wrap;
  }

  function feedback(kind, verdict, q, extra) {
    var box = el('div', 'feedback ' + kind);
    box.appendChild(el('p', 'verdict', verdict));
    (extra || []).forEach(function (node) { box.appendChild(node); });
    var exp = el('p');
    exp.appendChild(el('span', 'label', '해설 '));
    exp.appendChild(document.createTextNode(q.explanation));
    box.appendChild(exp);
    box.appendChild(evidenceBlock(q));
    return box;
  }

  function nextButton() {
    var last = pos === order.length - 1;
    var btn = el('button', 'btn', last ? '결과 보기' : '다음 문항 →');
    btn.type = 'button';
    btn.addEventListener('click', function () { pos += 1; render(); });
    return btn;
  }

  function renderQuestion() {
    var index = order[pos];
    var q = quiz.questions[index];
    stage.textContent = '';
    var tags = el('div', 'tags');
    tags.appendChild(el('span', 'tag', (index + 1) + '번'));
    tags.appendChild(el('span', 'tag', q.level));
    tags.appendChild(el('span', 'tag', q.type === 'multiple_choice' ? '객관식' : '주관식'));
    stage.appendChild(tags);
    stage.appendChild(el('p', 'prompt', q.prompt));
    var actions = el('div', 'actions');
    var check = el('button', 'btn', '정답 확인');
    check.type = 'button';
    check.disabled = true;

    if (q.type === 'multiple_choice') {
      var picked = null;
      var list = el('div', 'choices');
      var buttons = q.choices.map(function (c, i) {
        var b = el('button', 'choice');
        b.type = 'button';
        b.appendChild(el('span', 'mark', MARKS[i]));
        b.appendChild(el('span', '', c));
        b.addEventListener('click', function () {
          picked = i;
          buttons.forEach(function (x) { x.classList.remove('picked'); });
          b.classList.add('picked');
          check.disabled = false;
        });
        list.appendChild(b);
        return b;
      });
      stage.appendChild(list);
      check.addEventListener('click', function () {
        var ok = picked === q.correct_index;
        results[index] = ok ? 1 : 0;
        buttons.forEach(function (b, i) {
          b.disabled = true;
          b.classList.remove('picked');
          if (i === q.correct_index) b.classList.add('right');
          else if (i === picked) b.classList.add('wrong');
        });
        actions.textContent = '';
        var answer = el('p');
        answer.appendChild(el('span', 'label', '정답 '));
        answer.appendChild(document.createTextNode(MARKS[q.correct_index] + ' ' + q.choices[q.correct_index]));
        stage.insertBefore(feedback(ok ? 'right' : 'wrong', ok ? '정답이에요!' : '아쉬워요, 오답이에요.', q, ok ? [] : [answer]), actions);
        actions.appendChild(nextButton());
        actions.querySelector('button').focus();
      });
    } else {
      var box = el('textarea');
      box.setAttribute('aria-label', '답 쓰기');
      box.placeholder = '답을 써 보세요. 쓰고 나서 정답 확인을 누르면 모범 답안과 채점 기준이 나와요.';
      box.addEventListener('input', function () { check.disabled = !box.value.trim(); });
      stage.appendChild(box);
      check.addEventListener('click', function () {
        box.readOnly = true;
        actions.textContent = '';
        var model = el('p');
        model.appendChild(el('span', 'label', '모범 답안 '));
        model.appendChild(document.createTextNode(q.answer));
        var criteria = el('p');
        criteria.appendChild(el('span', 'label', '채점 기준 '));
        criteria.appendChild(document.createTextNode(q.grading_criteria));
        var fb = feedback('self', '채점 기준과 비교해서 직접 채점해 주세요.', q, [model, criteria]);
        stage.insertBefore(fb, actions);
        [['맞았어요', 1, 'right'], ['부분 정답', 0.5, 'part'], ['틀렸어요', 0, 'wrong']].forEach(function (g) {
          var b = el('button', 'btn ghost', g[0]);
          b.type = 'button';
          b.addEventListener('click', function () {
            results[index] = g[1];
            fb.className = 'feedback ' + g[2];
            fb.querySelector('.verdict').textContent = '내 채점: ' + g[0];
            actions.textContent = '';
            actions.appendChild(nextButton());
            actions.querySelector('button').focus();
          });
          actions.appendChild(b);
        });
      });
    }
    actions.appendChild(check);
    stage.appendChild(actions);
    stage.appendChild(el('p', 'hint', '정답은 확인 버튼을 누른 뒤에만 보여요.'));
  }

  function renderResult() {
    stage.textContent = '';
    var got = 0;
    order.forEach(function (i) { got += results[i] || 0; });
    stage.appendChild(el('div', 'label', order.length === all.length ? '전체 결과' : '다시 푼 문항 결과'));
    stage.appendChild(el('div', 'score', got + ' / ' + order.length));

    var table = el('table');
    var head = el('tr');
    ['수준', '문항', '점수'].forEach(function (h) { head.appendChild(el('th', '', h)); });
    table.appendChild(head);
    LEVELS.forEach(function (level) {
      var items = order.filter(function (i) { return quiz.questions[i].level === level; });
      if (!items.length) return;
      var sum = items.reduce(function (s, i) { return s + (results[i] || 0); }, 0);
      var row = el('tr');
      row.appendChild(el('td', '', level));
      row.appendChild(el('td', '', items.length + '개'));
      row.appendChild(el('td', '', sum + ' / ' + items.length));
      table.appendChild(row);
    });
    stage.appendChild(table);

    var missed = order.filter(function (i) { return (results[i] || 0) < 1; });
    if (missed.length) {
      stage.appendChild(el('div', 'label', '다시 볼 곳'));
      var ul = el('ul', 'review');
      missed.forEach(function (i) {
        var q = quiz.questions[i];
        var pages = q.evidence.map(function (e) { return 'p.' + e.page; })
          .filter(function (v, k, arr) { return arr.indexOf(v) === k; }).join(', ');
        var short = q.prompt.length > 70 ? q.prompt.slice(0, 70) + '…' : q.prompt;
        ul.appendChild(el('li', '', (i + 1) + '번 [' + q.level + '] ' + short + ' → 논문 ' + pages));
      });
      stage.appendChild(ul);
    } else {
      stage.appendChild(el('p', '', '모두 맞혔어요. 잘했어요!'));
    }

    var actions = el('div', 'actions');
    if (missed.length) {
      var retry = el('button', 'btn', '틀린 문항만 다시 풀기');
      retry.type = 'button';
      retry.addEventListener('click', function () { order = missed; pos = 0; render(); });
      actions.appendChild(retry);
    }
    var again = el('button', 'btn ghost', '처음부터 다시');
    again.type = 'button';
    again.addEventListener('click', function () { order = all.slice(); pos = 0; results = {}; render(); });
    actions.appendChild(again);
    stage.appendChild(actions);
  }

  function render() {
    updateProgress();
    if (pos < order.length) renderQuestion(); else renderResult();
    window.scrollTo(0, 0);
  }

  render();
})();
</script>
</body>
</html>
