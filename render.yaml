services:
  - type: web
    name: solo-leveling-staging
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    domains:
      - solo-leveling-staging.soogyung.com
    envVars:
      - key: APP_ENV
        value: staging
      - key: API_HOST
        value: 0.0.0.0
      - key: WEB_STATIC_ROOT
        value: /app/web
      - key: DATABASE_URL
        fromDatabase:
          name: solo-leveling-staging-db
          property: connectionString
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URL
        sync: false
      - key: WEB_OIDC_AUTHORIZATION_URL
        sync: false
      - key: WEB_OIDC_TOKEN_URL
        sync: false
      - key: WEB_OIDC_USERINFO_URL
        sync: false
      - key: WEB_OIDC_CLIENT_ID
        sync: false
      - key: WEB_OIDC_CLIENT_SECRET
        sync: false
      - key: WEB_OIDC_REDIRECT_URI
        value: https://solo-leveling-staging.soogyung.com/v1/auth/callback
      - key: WEB_APP_ORIGIN
        value: https://solo-leveling-staging.soogyung.com

databases:
  - name: solo-leveling-staging-db
    plan: free
    databaseName: solo_leveling_staging
    user: solo_leveling_staging
