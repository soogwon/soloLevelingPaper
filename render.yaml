services:
  - type: web
    name: solo-leveling-staging
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    domains:
      - solo-leveling-staging.soogyung.com
    envVars:
      - key: APP_ENV
        value: staging
      - key: API_HOST
        value: 0.0.0.0
      - key: WEB_STATIC_ROOT
        value: /app/web
      - key: DATABASE_URL
        fromDatabase:
          name: solo-leveling-staging-db
          property: connectionString
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URL
        sync: false
      - key: WEB_OIDC_AUTHORIZATION_URL
        sync: false
      - key: WEB_OIDC_TOKEN_URL
        sync: false
      - key: WEB_OIDC_USERINFO_URL
        sync: false
      - key: WEB_OIDC_CLIENT_ID
        sync: false
      - key: WEB_OIDC_CLIENT_SECRET
        sync: false
      - key: WEB_OIDC_REDIRECT_URI
        value: https://solo-leveling-staging.soogyung.com/v1/auth/callback
      - key: WEB_APP_ORIGIN
        value: https://solo-leveling-staging.soogyung.com
      - key: REMOTE_MCP_SPIKE_ENABLED
        value: "false"
      - key: REMOTE_MCP_RESOURCE_URL
        value: https://solo-leveling-staging.soogyung.com/mcp
      - key: REMOTE_MCP_OIDC_ISSUER
        sync: false
      - key: REMOTE_MCP_OIDC_AUDIENCE
        sync: false
      - key: REMOTE_MCP_OIDC_JWKS_URL
        sync: false
      - key: REMOTE_MCP_ALLOWED_CLIENT_IDS
        sync: false
      - key: REMOTE_MCP_REQUIRED_SCOPE
        value: spike:read
      - key: REMOTE_MCP_ALLOWED_HOSTS
        value: solo-leveling-staging.soogyung.com
      - key: REMOTE_MCP_ALLOWED_ORIGINS
        value: https://claude.ai
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      # Free staging에는 Shell/One-Off Job이 없어 프로세스 시작마다 삭제 큐를 제한된 건수만 처리한다.
      # 운영 scheduler가 생기면 false로 바꾸고 별도 worker에서 실행한다.
      - key: REMOTE_DELETION_CLEANUP_ON_START
        value: "true"
      - key: REMOTE_DELETION_CLEANUP_MAX_JOBS
        value: "10"
      - key: REMOTE_DELETION_CLEANUP_LEASE_SECONDS
        value: "300"

databases:
  - name: solo-leveling-staging-db
    plan: free
    databaseName: solo_leveling_staging
    user: solo_leveling_staging
