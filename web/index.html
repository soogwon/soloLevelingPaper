<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solo Leveling · 나의 논문 학습 아카이브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">본문으로 건너뛰기</a>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/papers">
        <span class="brand-name">Solo Leveling<span>.</span></span>
        <span class="brand-sub">나의 논문 학습 아카이브</span>
      </a>
      <nav class="nav" aria-label="주 메뉴">
        <a class="nav-link" href="#/papers" data-nav="papers">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4v16"/><path d="M9 4v16"/><path d="m13 5 3.5-1 4 15.5-3.5 1z"/></svg>
          논문 아카이브
        </a>
        <a class="nav-link" href="#/notes" data-nav="notes">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7"/><path d="M9 16h4"/></svg>
          메모·하이라이트
        </a>
        <a class="nav-link" href="#/collections" data-nav="collections">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          컬렉션
        </a>
      </nav>
      <div class="sidebar-foot">
        <span class="badge b-ok">저장된 기록만 표시</span>
        <p>학습은 Claude에서,<br>기록은 여기서 다시 봐요.</p>
        <p class="mock-flag" hidden>예시 데이터로 실행 중</p>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <button type="button" class="back-btn" id="back-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          뒤로
        </button>
        <form class="search" role="search" id="global-search">
          <label for="global-q" class="sr-only">논문·메모 검색</label>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="global-q" name="q" type="search" placeholder="논문 제목, 메모 내용을 검색하세요" autocomplete="off" maxlength="200">
        </form>
        <a class="avatar" href="#/account" data-nav="account" aria-label="내 계정과 연결 기기">나</a>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
