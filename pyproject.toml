[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-leveling-paper"
version = "0.1.0"
description = "MCP-based paper learning service"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
solo-leveling-mcp = "solo_leveling.interfaces.mcp.runtime:main"

[project.optional-dependencies]
dev = ["pytest", "mcp>=1,<2", "pdfplumber", "chromadb", "requests>=2.32,<3", "python-dotenv>=1,<2"]
generation = ["requests>=2.32,<3", "python-dotenv>=1,<2"]
translation = ["requests>=2.32,<3", "python-dotenv>=1,<2"]
local = [
    "mcp>=1,<2",
    "pdfplumber",
    "chromadb",
    "sentence-transformers",
    "requests>=2.32,<3",
    "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
