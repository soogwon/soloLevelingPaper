[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-leveling-paper"
version = "0.1.0"
description = "MCP-based paper learning service"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
solo-leveling-mcp = "solo_leveling.interfaces.mcp.runtime:main"
solo-leveling-desktop = "solo_leveling.interfaces.cli.desktop:main"
solo-leveling-prepare-model = "solo_leveling.interfaces.cli.prepare_embedding_model:main"
solo-leveling-mcp-diagnostics = "solo_leveling.interfaces.cli.mcp_diagnostics:main"
solo-leveling-verification-retention = "solo_leveling.interfaces.cli.verification_retention:main"
solo-leveling-api = "solo_leveling.interfaces.http.runtime:main"
solo-leveling-connect = "solo_leveling.interfaces.cli.connect_server:main"
solo-leveling-server-migrate = "solo_leveling.interfaces.cli.server_migrations:main"
solo-leveling-kg-check = "solo_leveling.interfaces.cli.kg_check:main"

[project.optional-dependencies]
dev = ["pytest", "filelock>=3.13,<5", "mcp>=1,<2", "jsonschema>=4.20,<5", "pdfplumber", "chromadb>=1.5.9,<1.6", "requests>=2.32,<3", "python-dotenv>=1,<2", "fastapi>=0.121,<0.122", "PyJWT[crypto]>=2.10,<3", "psycopg[binary,pool]>=3.2,<4", "keyring>=25,<26"]
server = ["requests>=2.32,<3", "fastapi>=0.121,<0.122", "uvicorn[standard]>=0.30,<1", "PyJWT[crypto]>=2.10,<3", "psycopg[binary,pool]>=3.2,<4", "boto3>=1.35,<2"]
generation = ["requests>=2.32,<3", "python-dotenv>=1,<2"]
translation = ["requests>=2.32,<3", "python-dotenv>=1,<2"]
local = [
    "filelock>=3.13,<5",
    "mcp>=1,<2",
    "jsonschema>=4.20,<5",
    "pdfplumber",
    "chromadb>=1.5.9,<1.6",
    "sentence-transformers",
    "requests>=2.32,<3",
    "python-dotenv>=1,<2",
    "keyring>=25,<26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"solo_leveling.interfaces.mcp" = ["assets/*.html", "assets/*.txt"]
"solo_leveling.knowledge" = ["seed.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# 정의되지 않은 이름·미사용 import 같은 실수만 잡는다. 테스트는 pytest fixture import가 많아 제외한다.
select = ["F"]
