name: Render 배포 이미지 검증
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/render-start.sh
      - deploy/cleanup/**
      - src/solo_leveling/domain/deletion_policy.py
      - src/solo_leveling/infrastructure/storage/remote_deletion_backend.py
      - src/solo_leveling/interfaces/cli/remote_deletion_cleanup.py
      - src/solo_leveling/interfaces/cli/remote_upload_cleanup.py
      - src/solo_leveling/interfaces/http/**
      - src/solo_leveling/interfaces/mcp/**
      - src/solo_leveling/application/**
      - src/solo_leveling/domain/**
      - deploy/validation/**
      - .github/workflows/render-image.yml
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 배포 이미지 빌드
        run: docker build -t slp-render-test .
      - name: 이미지에 포함된 실행 파일과 제외 대상 확인
        run: |
          docker run --rm slp-render-test sh -ec '
            test "$(id -u)" != 0
            test -x deploy/render-start.sh
            test -f web/index.html
            test -f migrations/server/0007_server_summaries.sql
            test ! -e test_data
            test ! -e tests
            test ! -e web/tests
            test -z "$(find /app -iname "*.pdf" -print -quit)"
            python deploy/cleanup/run.py uploads
            python deploy/cleanup/run.py deletions
            solo-leveling-server-migrate --help
            solo-leveling-remote-deletion-cleanup --help
            solo-leveling-remote-upload-cleanup --help
            WEB_STATIC_ROOT=/app/web python -c "from solo_leveling.interfaces.http import create_app; create_app()"
          '
      - name: 제품 MCP 활성화 이미지 회귀
        run: |
          docker run --rm --network none \
            -e REMOTE_MCP_DATABASE_URL=postgresql://test:test@127.0.0.1/test \
            -v "$PWD/deploy/validation:/validation:ro" \
            slp-render-test python /validation/remote_mcp_image.py
