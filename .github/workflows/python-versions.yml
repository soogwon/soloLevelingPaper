name: Python 버전 호환

# PR마다 돌리면 Actions 시간이 두세 배가 되어 main 병합 후와 매주 한 번만 확인한다.
# PR 기본 테스트는 ci.yml에서 3.12로 돈다.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * 0'  # 매주 월요일 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-versions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      LOCAL_ONLY: 'true'
      ALLOW_EXTERNAL_API: 'false'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ANONYMIZED_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 테스트 의존성 설치
        run: python -m pip install -e ".[dev]"
      - name: 단위 테스트
        run: python -m pytest tests/unit -q -p no:cacheprovider
      - name: 통합 테스트
        if: ${{ !cancelled() }}
        run: python -m pytest tests/integration -q -p no:cacheprovider
