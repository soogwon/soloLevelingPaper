name: 테스트

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ruff 설치
        run: python -m pip install ruff==0.17.5
      - name: 린트
        run: ruff check src scripts

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LOCAL_ONLY: 'true'
      ALLOW_EXTERNAL_API: 'false'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ANONYMIZED_TELEMETRY: 'false'
      # 이 job 안에서만 쓰는 일회용 DB다. 실제 PostgreSQL에서 FK·트리거·SQL을 확인한다.
      SOLO_TEST_POSTGRES_DSN: postgresql://postgres:ci-only@localhost:5432/postgres
    services:
      postgres:
        # 원격 검색 migration이 vector extension을 사용하므로 PostgreSQL 16 호환
        # pgvector 공식 이미지를 사용한다.
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 테스트 의존성 설치
        run: python -m pip install -e ".[dev]"
      - name: 제한 worker와 초기화 리허설 개별 검증
        env:
          SOLO_RESET_REHEARSAL_DSN: postgresql://postgres:ci-only@localhost:5432/postgres
        run: |
          python -m pytest tests/integration/test_staging_reset_rehearsal.py tests/integration/test_worker_permissions_postgres.py -v -p no:cacheprovider --junitxml=worker-permissions.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('worker-permissions.xml').findall('.//testcase')
          assert len(cases) == 6, f'권한 리허설 사례 수 불일치: {len(cases)}'
          assert not any(case.find(tag) is not None for case in cases
                         for tag in ('skipped', 'failure', 'error')), '권한 리허설 미통과'
          print('제한 worker와 초기화 리허설: 6 passed, 0 skipped')
          PY
      - name: 제한 worker 리허설 결과 보관
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: worker-permissions
          path: worker-permissions.xml
          if-no-files-found: error
      - name: 제한 웹 계정과 백업 복구 개별 검증
        env:
          SOLO_BACKUP_DOCKER_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python -m pytest tests/integration/test_web_permissions_postgres.py tests/integration/test_web_backup_restore_postgres.py tests/integration/test_nonsuper_restore_postgres.py -v -p no:cacheprovider --junitxml=web-backup.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('web-backup.xml').findall('.//testcase')
          assert len(cases) == 8, f'웹·복구 사례 수 불일치: {len(cases)}'
          assert not any(case.find(tag) is not None for case in cases
                         for tag in ('skipped', 'failure', 'error')), '웹·복구 리허설 미통과'
          print('제한 웹·복구: 8 passed, 0 skipped')
          PY
      - name: 제한 웹 계정과 복구 결과 보관
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-backup
          path: web-backup.xml
          if-no-files-found: error
      - name: pgvector 공통 계약 개별 검증
        run: |
          python -m pytest tests/integration/test_pgvector_shared_contract.py -v -p no:cacheprovider --junitxml=pgvector-shared-contract.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('pgvector-shared-contract.xml').findall('.//testcase')
          # DSN 누락 등으로 건너뛴 실행을 성공으로 처리하지 않는다.
          assert len(cases) >= 16, f'공통 계약 사례 부족: {len(cases)}'
          assert not any(case.find(tag) is not None for case in cases
                         for tag in ('skipped', 'failure', 'error')), '미통과 공통 계약 사례가 있습니다'
          print(f'pgvector 공통 계약: {len(cases)} passed, 0 skipped')
          PY
      - name: pgvector 공통 계약 결과 보관
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-shared-contract
          path: pgvector-shared-contract.xml
          if-no-files-found: warn
      - name: PostgreSQL 이관 재실행 개별 검증
        run: |
          python -m pytest tests/integration/test_server_migration_replay_postgres.py -v -p no:cacheprovider --junitxml=migration-replay.xml
          python - <<'PYTEST'
          import xml.etree.ElementTree as ET
          cases = ET.parse('migration-replay.xml').findall('.//testcase')
          assert len(cases) == 1, f'이관 재실행 사례 수 불일치: {len(cases)}'
          assert not any(case.find(tag) is not None for case in cases
                         for tag in ('skipped', 'failure', 'error')), '이관 재실행 검증 미통과'
          print('PostgreSQL 이관 재실행: 1 passed, 0 skipped')
          PYTEST
      - name: PostgreSQL 이관 재실행 결과 보관
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-replay
          path: migration-replay.xml
          if-no-files-found: error
      - name: PostgreSQL 읽기 상태 개별 검증
        run: |
          python -m pytest tests/integration/test_reading_state_postgres.py -v -p no:cacheprovider --junitxml=reading-state-postgres.xml
          python - <<'PYTEST'
          import xml.etree.ElementTree as ET
          cases = ET.parse('reading-state-postgres.xml').findall('.//testcase')
          assert len(cases) == 4, f'읽기 상태 사례 수 불일치: {len(cases)}'
          assert not any(case.find(tag) is not None for case in cases
                         for tag in ('skipped', 'failure', 'error')), '읽기 상태 검증 미통과'
          print('PostgreSQL 읽기 상태: 4 passed, 0 skipped')
          PYTEST
      - name: PostgreSQL 읽기 상태 결과 보관
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reading-state-postgres
          path: reading-state-postgres.xml
          if-no-files-found: error
      - name: 단위 테스트
        run: python -m pytest tests/unit -q -p no:cacheprovider
      - name: 통합 테스트
        if: ${{ !cancelled() }}
        run: python -m pytest tests/integration -q -p no:cacheprovider

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 웹 테스트
        working-directory: web
        run: npm test
      - name: 원격 업로드 대역 테스트
        run: node --test ui/remote-upload-preview/upload.test.mjs

  mcp-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [paper-detail, paper-status, quiz, reading-before, reading-comparison]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/${{ matrix.app }}/package-lock.json
      - name: 의존성 설치
        working-directory: ui/${{ matrix.app }}
        run: npm ci --no-audit --no-fund
      - name: 테스트
        working-directory: ui/${{ matrix.app }}
        run: npm test

  mcp-ui-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # pnpm 11은 esbuild 빌드 스크립트 승인 대기를 오류로 본다. 테스트에는 빌드가 필요 없다.
      # install과 test(실행 전 의존성 재확인) 모두에 적용되도록 환경 변수로 둔다.
      pnpm_config_strict_dep_builds: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # pnpm/action-setup은 pnpm 11 자체 설치 중 esbuild 빌드 승인 대기로 실패해 npm으로 설치한다.
      - name: pnpm 설치
        run: npm install -g pnpm@11.25.0
      - name: 의존성 설치
        working-directory: ui/learning-dashboard
        run: pnpm install --frozen-lockfile
      - name: 테스트
        working-directory: ui/learning-dashboard
        run: pnpm test
