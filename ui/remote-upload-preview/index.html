<!doctype html>
<html lang="ko"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원격 PDF 등록 대역 미리보기</title>
<style>body{font-family:system-ui;max-width:720px;margin:32px auto;padding:0 20px;color:#183047}section{border:1px solid #bccbd7;border-radius:12px;padding:20px;margin-top:20px}button,select,input{margin:8px 4px;padding:8px}dd{overflow-wrap:anywhere}p{line-height:1.6}</style>
<body><main>
<label for="file">로컬 PDF 선택 (이름·크기만 확인)</label><input id="file" aria-describedby="file-help" type="file" accept="application/pdf,.pdf">
<button id="cancel" type="button">선택 취소</button>
<p id="file-help">파일을 바꾸거나 다시 선택하면 이전 작업 상태를 비웁니다. 선택창 취소나 같은 파일 재선택으로 파일명도 사라졌다면 파일을 다시 선택해 주세요.</p>
<p><label for="fixture">검토용 서버 상태 대역</label>
<select id="fixture"><option>created</option><option>uploading</option><option>verified</option><option>failed</option><option>expired</option></select>
<button id="apply" type="button">대역 상태 표시</button></p>
<p><label for="job-state">검토용 처리 상태 대역</label>
<select id="job-state"><option>queued</option><option>running</option><option>succeeded</option><option>failed</option><option>cancelled</option><option>응답 유실</option></select>
<button id="job-apply" type="button">기존 작업 조회 대역 표시</button></p>
<div id="preview"></div>
</main><script type="module">
import {createPreview, renderPreview} from './upload.mjs';
const model = createPreview();
const file = document.querySelector('#file');
const paint = () => {document.querySelector('#preview').innerHTML = renderPreview(model.snapshot());};
file.addEventListener('change', () => {model.select(file.files[0] ?? null); paint();});
const clearSelection = () => {file.value='';model.select(null);paint();};
// 선택창 취소와 같은 파일 재선택의 cancel 이벤트도 이전 조회 상태를 폐기한다.
file.addEventListener('cancel', clearSelection);
document.querySelector('#cancel').addEventListener('click', clearSelection);
document.querySelector('#apply').addEventListener('click', () => {
  const state = model.snapshot();
  model.receive(state.generation, {intentId:`fixture-${state.generation}`,status:document.querySelector('#fixture').value,
    expiresAt:Date.now()+60000});paint();
});
document.querySelector('#job-apply').addEventListener('click', () => {
  const ticket = model.beginAdmissionLookup();
  if (ticket) {
    const status = document.querySelector('#job-state').value;
    model.receiveAdmission(ticket, status === '응답 유실' ? null : {intentId:ticket.intentId,
      job:{job_id:`fixture-job-${ticket.generation}`,paper_id:'fixture-paper',server_version_id:'v1',status}});
  }
  paint();
});
paint();
</script></body></html>
