<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><title>논문 근거 상세</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font:15px/1.7 system-ui,sans-serif;color:var(--color-text-primary,#22312d);background:var(--color-background-primary,#fafbf9)}main{max-width:1100px;margin:auto}h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}header p,.note{color:var(--color-text-secondary,#596b63);font-size:13px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{border:1px solid #94aa9d;border-radius:12px;padding:18px;min-width:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:0}button{font:inherit;color:inherit;background:transparent;border:1px solid #94aa9d;border-radius:8px;padding:6px 12px;margin:4px;cursor:pointer}button[aria-pressed=true]{background:#d6eadb;color:#183724}button:focus-visible{outline:3px solid #6b9d80;outline-offset:2px}dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:12px}dd{margin:0;overflow-wrap:anywhere}li{margin-bottom:12px}#answer{white-space:pre-wrap}#message{font-weight:600}[hidden]{display:none!important}@media(max-width:620px){.columns{grid-template-columns:1fr}body{padding:12px}dl{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){body{color:var(--color-text-primary,#e1ebe5);background:var(--color-background-primary,#19241e)}header p,.note{color:var(--color-text-secondary,#b2c5b8)}}
</style></head>
<body><main aria-busy="true">
<header><p>SOLO LEVELING PAPER · 읽기 전용</p><h1>논문 근거 상세</h1></header>
<p id="message" role="status" aria-live="polite">호스트 결과를 기다리고 있습니다.</p>
<div id="content" hidden>
<p id="metadata"></p><p id="availability" class="note"></p>
<section id="answer-section" hidden><h2 id="answer-heading">반환된 답변</h2><p id="verification" class="note"></p><p id="answer"></p><div id="claims-section" hidden><h2 id="claims-heading">주장별 근거로 이동</h2><ol id="claims"></ol></div></section>
<p id="pagination" class="note"></p>
<nav id="evidence-list" aria-label="인용 근거 선택"></nav>
<section id="detail" tabindex="-1"><h2 id="location"></h2><p id="file"></p>
<p class="note">저장된 인용 구간입니다. 논문 전체·문장별 번역 정렬·PDF 좌표가 아닙니다. 섹션 ID가 있는 경우 페이지 옆에 표시합니다.</p>
<div class="columns"><section class="panel"><h3>원문</h3><pre id="original"></pre></section><section class="panel"><h3>한국어 번역</h3><pre id="translation"></pre></section></div>
<details><summary>출처 연결 정보</summary><dl id="provenance"></dl></details></section>
</div>
<p class="note">메모·하이라이트 작성은 아직 지원하지 않습니다. 화면을 사용할 수 없으면 채팅의 도구 응답을 확인하세요. 이 화면은 재검색·재번역·자동 호출을 하지 않습니다.</p>
</main><!-- APP_SCRIPT --></body></html>
