<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><title>논문 서버 동기화 확인</title>
<style>body{font:1em/1.6 system-ui;margin:1rem}h1{font-size:1.2rem}button{font:inherit;padding:.5rem .8rem;margin:.5rem .3rem .5rem 0}p{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:1rem 0}</style>
</head><body><main><h1>논문 메타데이터 서버 동기화</h1><p id="paper"></p><p id="notice"></p>
<label><input id="agree" type="checkbox" disabled> 전송 항목과 외부 웹 표시 범위를 확인했으며 이 논문의 메타데이터 동기화에 동의합니다.</label>
<button id="confirm" disabled>동의하고 동기화</button><button id="cancel" disabled>취소</button>
<p id="status" role="status">안내를 불러오는 중입니다.</p></main><!-- APP_SCRIPT --></body></html>
