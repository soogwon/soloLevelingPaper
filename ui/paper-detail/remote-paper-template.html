<!doctype html><html lang="ko"><meta charset="utf-8"><title>원격 논문 상세</title><body>
<h1>원격 논문 상세</h1><p>고정 게시본과 저장 기록만 조회합니다. AI 생성·기록 수정은 하지 않습니다.</p>
<p id="status" role="status">조회하는 중입니다.</p>
<pre id="paper" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
<h2>저장 요약</h2><pre id="summary" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
<button id="summary-export" disabled>Markdown 내보내기</button>
<p>내보낸 Markdown은 아래 입력란에서 복사해 .md 파일로 저장할 수 있습니다.</p>
<textarea style="width:100%;min-height:12rem" id="summary-markdown" readonly aria-label="내보낸 Markdown — 복사하여 저장" hidden></textarea>
<h2>목차</h2><pre id="sections" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
<button id="sections-more" disabled>다음 목차 20개</button>
<h2>학습 맥락 전체 메모·하이라이트</h2><pre id="records" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
<button id="records-more" disabled>다음 기록 20개</button>
<button id="refresh" disabled>처음부터 새로고침</button>
<!-- APP_SCRIPT --></body></html>
